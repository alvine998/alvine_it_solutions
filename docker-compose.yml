services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: alvine_server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 4005
    ports:
      - "4005:4005"
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const r=await fetch('http://localhost:4005/api/health'); if(!r.ok) throw new Error(String(r.status));\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
      start_interval: 3s
    networks:
      - app-network

  app-blue:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_ROUTER_CUSTOMER_URL=${VITE_ROUTER_CUSTOMER_URL:-}
    container_name: alvine_app_blue
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 3s
    networks:
      - app-network

  app-green:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_ROUTER_CUSTOMER_URL=${VITE_ROUTER_CUSTOMER_URL:-}
    container_name: alvine_app_green
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 3s
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    container_name: alvine_nginx
    ports:
      - "3025:80"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
      # app-blue / app-green intentionally NOT required — blue-green keeps
      # only one slot running. Require both would block startup after deploy.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
