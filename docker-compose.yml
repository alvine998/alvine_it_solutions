services:
  app-blue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

  app-green:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "3025:80"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-blue
      - app-green
    restart: unless-stopped
