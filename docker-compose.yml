services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: alvine_server
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI}
      PORT: 3001
    ports:
      - "3001:3001"
    networks:
      - app-network

  app-blue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - app-network

  app-green:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "3025:80"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-blue
      - app-green
      - server
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
